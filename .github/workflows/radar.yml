on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-radar]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take Screenshot and Generate Tactical Report
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            
            await page.goto('https://geofs-live-radar.onrender.com', { waitUntil: 'networkidle2', timeout: 90000 });
            
            // Wait for markers
            await new Promise(r => setTimeout(r, 60000)); 

            try { await page.click('.fa-moon'); } catch(e) {}

            const scanResult = await page.evaluate(() => {
              const indiaBox = { xMin: 1135, xMax: 1225, yMin: 440, yMax: 590 };

              return Array.from(document.querySelectorAll('.leaflet-marker-icon')).map(m => {
                const name = (m.title || m.innerText || m.getAttribute('aria-label') || '').replace(/[^a-zA-Z0-9()[\] _-]/g, '');
                if (!name) return null;

                const rect = m.getBoundingClientRect();
                const isOverIndia = (rect.left > indiaBox.xMin && rect.left < indiaBox.xMax) &&
                                    (rect.top > indiaBox.yMin && rect.top < indiaBox.yMax);
                
                return { name, isOverIndia };
              }).filter(x => x !== null);
            });

            // --- FORCE REGISTRY MAPPING ---
            const forceRegistry = {
              'United States of America': ['USAF', 'USAF-T'],
              'British Empire': ['RAF', 'RN', 'RNFAA', 'RADAF', 'ALF', 'AAF', 'RIAF'],
              'Royal New Zealand Air Force': ['RNZAF'],
              'Royal Australian Air Force': ['RAAF', 'RAN'],
              'Empire of Batavopyraea': ['BPYR', 'RNPN'],
              'United Arab Emirates': ['UAEAF', 'UAE', 'UAEN', 'UAEAF-P'],
              'Bundeswehr Luftwaffe': ['LUFT'],
              'Central African Empire': ['CAEAF', 'CAENF'],
              'Federation of the South Cone': ['FCS'],
              'Royal Canadian Air Force': ['RCAF', 'RCN'],
              'Pakistan': ['PAF', 'PAKISTAN']
            };

            const allMilTags = Object.values(forceRegistry).flat();

            // 1. FRIENDLY IAF
            const iafList = scanResult.filter(p => {
                const n = p.name.toUpperCase();
                return n.includes('IAF') && !n.includes('RIAF');
            }).map(p => p.name);
            
            // 2. OTHER AIR FORCES (Grouped)
            const groupedOtherAF = {};
            const otherAFList = scanResult.filter(p => {
              const name = p.name.toUpperCase();
              const isFriendlyIAF = name.includes('IAF') && !name.includes('RIAF');
              if (isFriendlyIAF || name.startsWith('EK')) return false;

              // Find which nation they belong to
              for (const [nation, tags] of Object.entries(forceRegistry)) {
                if (tags.some(tag => name.includes(tag))) {
                  if (!groupedOtherAF[nation]) groupedOtherAF[nation] = [];
                  groupedOtherAF[nation].push(p.name);
                  return true;
                }
              }
              
              // Generic Air Force detection for tags not in registry
              if (name.includes('AIRFORCE') || name.endsWith('AF') || name.includes(' AF')) {
                  if (!groupedOtherAF['Unknown Foreign AF']) groupedOtherAF['Unknown Foreign AF'] = [];
                  groupedOtherAF['Unknown Foreign AF'].push(p.name);
                  return true;
              }
              return false;
            });

            // 3. UNIDENTIFIED
            const uList = scanResult.filter(p => {
              const name = p.name.toUpperCase();
              const isFriendly = iafList.includes(p.name);
              const isOther = otherAFList.some(o => o.name === p.name);
              return name.includes('[U') && !isFriendly && !isOther;
            }).map(p => p.name);

            // 4. STATUS LOGIC
            let statusUpdate = '\\n\\n🔵 **STATUS:** All clear. No foreign military in sector.';
            const incursions = otherAFList.filter(p => p.isOverIndia).map(p => p.name);

            if (incursions.length > 0) {
              statusUpdate = '\\n\\n🚨 **RED ALERT: Foreign Military Aircraft detected inside INDIAN AIRSPACE!**\\n**Intercept Targets:** ' + incursions.join(', ');
            } else if (otherAFList.length > 0) {
              statusUpdate = '\\n\\n⚠️ **WARNING: Foreign Military activity detected outside borders.**';
            }

            // 5. FORMATTING THE REPORT
            let otherAFString = '';
            for (const [nation, pilots] of Object.entries(groupedOtherAF)) {
              otherAFString += '\\n' + nation + ' : ' + pilots.join(', ');
            }
            if (!otherAFString) otherAFString = ' N/A';

            const report = '🛰️ **GMRP-IAF ANALYTIC & TACTICAL REPORT**\\n\\n🟢 **IAF:** ' + (iafList.length > 0 ? iafList.join(', ') : 'N/A') + 
                           '\\n🟡 **[U]:** ' + (uList.length > 0 ? uList.join(', ') : 'N/A') + 
                           '\\n🔴 **Other Air Forces:** ' + otherAFString + statusUpdate;
            
            fs.writeFileSync('report.txt', report);
            await page.screenshot({ path: 'radar.png' });
            await browser.close();
          })();"
          
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          REPORT_BODY=$(cat report.txt)
          curl -H "Content-Type: application/json" \
               -d "$(JSON_REPORT=\"$REPORT_BODY\" node -e 'console.log(JSON.stringify({content: process.env.JSON_REPORT}))')" \
               $DISCORD_WEBHOOK
          curl -F "file=@radar.png" $DISCORD_WEBHOOK
